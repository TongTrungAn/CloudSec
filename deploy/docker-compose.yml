version: '3.8'

services:
  # MinIO S3 Object Storage (Chạy non-root, cgroups limit)
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: cloudsec-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudsec_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cloudsec_secret_key_2026}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cloudsec-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 1024M

  # Loki Log Aggregator
  loki:
    image: grafana/loki:2.9.2
    container_name: cloudsec-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cloudsec-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  cloudsec-net:
    driver: bridge

volumes:
  minio_data:
    driver: local
